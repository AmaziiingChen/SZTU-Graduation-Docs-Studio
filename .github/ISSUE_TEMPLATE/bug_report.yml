name: Bug 报告
description: 报告可复现的功能、导出或跨平台问题
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传真实学生材料、签名、商业字体、密钥、数据库或未脱敏日志。安全漏洞请使用仓库 Security 页面的私密报告入口。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 说明期望行为与实际行为。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 应用版本或完整提交哈希
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux（开发环境）
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 使用虚构、脱敏数据描述操作步骤。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可提供退出码、错误代码、脱敏日志与 fixture 哈希。请勿粘贴本机私人路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容不含真实学生身份信息、签名、凭据或受限文件。
          required: true

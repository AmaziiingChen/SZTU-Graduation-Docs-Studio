name: Chinese profile acceptance
on:
  push:
    branches: ['exp/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: chinese-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Install and render as a Chinese-named standard user
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CJK_USER: 林振宇
      CJK_PASSWORD: 'Sztu-CI-2026!'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: app
          persist-credentials: false
      - name: Preserve template LF bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AmaziiingChen/SZTU-Thesis-Latex-Template
          ref: 1c9b6929ddb376c1df83f5a66ffc480db9e429c1
          path: Thesis
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch verified private test inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_resources.py
      - name: Build native Windows offline installer
        shell: pwsh
        run: pnpm package:win:offline
      - name: Prepare a workspace the test account can reach
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cjk = $env:CJK_USER
          # A profile directory named after a Chinese account is what the 0.1.15 report showed.
          # `net user` exists on every supported Windows image, unlike the LocalAccounts module.
          net user $cjk $env:CJK_PASSWORD /add /comment:"SZTU CI acceptance" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            (net user $cjk | Out-String) -match $cjk | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the Chinese-named test account' }
          }
          $work = 'C:\sztu-ci'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          # The account is a standard user: no elevation anywhere in this job. Grant first, because
          # every file created below then inherits the ACE instead of needing a /T walk over node_modules.
          icacls $work /grant "${cjk}:(OI)(CI)M" /Q | Out-Null
          # robocopy with /MT moves the pnpm tree in minutes; Copy-Item took longer than the job timeout.
          # node_modules and .venv are full of links into the runner's own store; copying them leaves
          # dangling absolute paths, so they are rebuilt inside the staged tree instead.
          $copyArgs = @("$env:GITHUB_WORKSPACE", $work, '/E', '/MT:16', '/R:1', '/W:1', '/NFL', '/NDL', '/NJH', '/NJS', '/NP',
            '/XD', "$env:GITHUB_WORKSPACE\app\build", "$env:GITHUB_WORKSPACE\.git", "$env:GITHUB_WORKSPACE\Thesis\.git",
            "$env:GITHUB_WORKSPACE\app\node_modules", "$env:GITHUB_WORKSPACE\app\apps\desktop\node_modules",
            "$env:GITHUB_WORKSPACE\app\.venv")
          robocopy @copyArgs | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Could not stage the workspace (robocopy $LASTEXITCODE)" }
          # The scheduled task inherits the machine environment, so the licensed CI fonts have to be
          # staged next to the workspace and named explicitly; the packaged bundle ships only part of set.
          $fonts = "$work\app\build\ci-fonts"
          New-Item -ItemType Directory -Path (Split-Path $fonts) -Force | Out-Null
          robocopy "$env:GITHUB_WORKSPACE\app\build\ci-fonts" $fonts /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Could not stage the CI fonts (robocopy $LASTEXITCODE)" }
          Push-Location "$work\app"
          # pnpm links packages to the store in the runner's profile, which a standard account cannot
          # traverse, so the staged tree gets its own store.
          pnpm install --frozen-lockfile --store-dir "$work\pnpm-store"
          if ($LASTEXITCODE -ne 0) { throw 'Could not reinstall the staged workspace' }
          if (-not (Test-Path "$work\app\.venv\Scripts\python.exe")) {
            pnpm setup:backend
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the backend runtime' }
          }
          Pop-Location
          $installer = Get-ChildItem -Path "$work\app\release\offline\*-offline.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Offline installer was not created' }
          $log = Join-Path $work 'accept.log'
          $script = Join-Path $work 'run-accept.cmd'
          # The scheduled task inherits the machine PATH, not this job's, so pin Node down.
          $node = (Get-Command node).Source
          Write-Host "node: $node"
          # Every stage leaves a marker, so a stall is localised instead of only reported as a timeout.
          @(
            '@echo off',
            "set SZTU_FONT_DIR=$fonts",
            "whoami /user > `"$work\whoami.txt`" 2>&1",
            "set > `"$work\environment.txt`"",
            "echo started=%DATE% %TIME% > `"$work\stage-1-started.txt`"",
            "`"$($installer.FullName)`" /S /D=$work\app16",
            "echo install-exit=%errorlevel% >> `"$work\stage-2-installed.txt`"",
            "cd /d $work\app",
            "`"$node`" scripts\accept_ci_bundle.mjs `"$work\app16`" `"$work\app\tmp\ci-acceptance`" >> `"$log`" 2>&1",
            "echo accept-exit=%errorlevel% >> `"$work\stage-3-accepted.txt`"",
            "echo %errorlevel% > `"$work\accept.exit`""
          ) | Set-Content -Path $script -Encoding ascii
          icacls $script /grant "${cjk}:RX" /Q | Out-Null
          # A fresh standard account has no batch-logon right, so the task registers but never runs.
          # Grant it explicitly; otherwise the wait loop only ever sees a timeout.
          $sid = (New-Object System.Security.Principal.NTAccount($cjk)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $inf = Join-Path $env:RUNNER_TEMP 'batch-logon.inf'
          $sdb = Join-Path $env:RUNNER_TEMP 'batch-logon.sdb'
          secedit /export /cfg $inf /quiet | Out-Null
          $text = Get-Content $inf -Raw
          if ($text -match 'SeBatchLogonRight = ([^\r\n]*)') {
            $current = $Matches[1].Trim()
            if ($current -notlike "*$sid*") {
              $joined = (@($current.Split(',') | Where-Object { $_.Trim() }) + "*$sid") -join ','
              $text = $text -replace 'SeBatchLogonRight = [^\r\n]*', "SeBatchLogonRight = $joined"
            }
          } else {
            $text = $text -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid"
          }
          Set-Content -Path $inf -Value $text -Encoding unicode
          secedit /configure /db $sdb /cfg $inf /areas USER_RIGHTS /quiet | Out-Null
          Write-Host "batch logon granted to $cjk ($sid)"
          # Scheduled tasks run with the account's own profile, which is how the failure appears.
          schtasks /create /tn 'SZTU-CI-Accept' /tr "cmd /c $script" /sc once /st 00:00 /ru $cjk /rp $env:CJK_PASSWORD /f | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not schedule the acceptance run' }
          schtasks /run /tn 'SZTU-CI-Accept' | Out-Null
          $started = Get-Date
          $deadline = $started.AddMinutes(50)
          $exit = Join-Path $work 'accept.exit'
          while (-not (Test-Path $exit)) {
            if ((Get-Date) -gt $deadline) {
              Write-Host '--- timed out, collecting what the scheduled task reached ---'
              Get-ChildItem -Path $work -Filter 'stage-*.txt' -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host ($_.Name + ': ' + (Get-Content $_.FullName -Raw)) }
              Get-Process -ErrorAction SilentlyContinue |
                Where-Object { $_.ProcessName -match 'sztu|node|Un_A|installer|nsis' } |
                Select-Object ProcessName, Id, StartTime | Format-Table | Out-String | Write-Host
              if (Test-Path $log) { Write-Host '--- acceptance log (tail) ---'; Get-Content $log -Tail 80 }
              throw 'The Chinese-profile acceptance run timed out'
            }
            Start-Sleep -Seconds 15
            $elapsed = [int]((Get-Date) - $started).TotalMinutes
            if ($elapsed -ge 6 -and -not (Test-Path (Join-Path $work 'stage-1-started.txt'))) {
              Write-Host '--- the scheduled task never started ---'
              schtasks /query /tn 'SZTU-CI-Accept' /v /fo LIST | Out-String | Write-Host
              throw 'The scheduled task did not start'
            }
            if ($elapsed % 2 -eq 0) { Write-Host "waiting $elapsed min" }
          }
          Write-Host '--- whoami ---'
          Get-Content (Join-Path $work 'whoami.txt')
          Write-Host '--- profile and program data ---'
          Write-Host ('profile: ' + (Join-Path 'C:\Users' $cjk))
          Get-ChildItem -Path 'C:\Users' | Select-Object -ExpandProperty Name
          Get-ChildItem -Path 'C:\ProgramData\SZTU-Docs' -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName
          Write-Host '--- acceptance log ---'
          Get-Content $log
          $code = (Get-Content $exit | Select-Object -First 1).Trim()
          if ($code -ne '0') { throw "Acceptance exited $code" }
      - name: Assert the engine left the Chinese profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $descriptor = 'C:\sztu-ci\app16\resources\offline-runtime-location.json'
          if (-not (Test-Path $descriptor)) { throw 'The installer did not ship an engine descriptor' }
          $data = Get-Content $descriptor -Raw | ConvertFrom-Json
          if ($data.schema_version -ne '3.0') { throw "Unexpected descriptor schema $($data.schema_version)" }
          $sequence = ($data.roots | ForEach-Object { if ($_.kind -eq 'path') { $_.value } else { "%$($_.name)%" } }) -join ' -> '
          Write-Host "engine roots: $sequence"
          $engine = Join-Path 'C:\ProgramData\SZTU-Docs\engine' $data.runtime_id.Substring(0, 16)
          Write-Host "engine: $engine"
          if (-not (Test-Path (Join-Path $engine 'complete.txt'))) { throw 'The machine-wide engine was not completed' }
          if (-not (Test-Path (Join-Path $engine 'texlive\texmf.cnf'))) { throw 'The machine-wide engine is missing its TeX configuration' }
          if (-not (Test-Path (Join-Path $engine 'texlive\texmf-var\web2c\xetex\xelatex.fmt'))) { throw 'The machine-wide engine is missing its format file' }
          foreach ($path in @($engine, $engine + '\texlive')) {
            $ascii = -not ($path.ToCharArray() | Where-Object { [int]$_ -gt 126 })
            if (-not $ascii) { throw "Engine path is not ASCII: $path" }
          }
          # The per-user copy must not be what the app resolved.
          $legacy = Join-Path 'C:\Users\林振宇\AppData\Local\SZTU-Docs\r' $data.runtime_id.Substring(0, 16)
          Write-Host "legacy per-user copy present: $(Test-Path $legacy)"
          $acceptance = Get-Content 'C:\sztu-ci\app\tmp\ci-acceptance\acceptance.json' -Raw | ConvertFrom-Json
          Write-Host "version: $($acceptance.version) status: $($acceptance.status) documents: $($acceptance.documents.Count)"
          if ($acceptance.status -ne 'pass') { throw "Acceptance status $($acceptance.status)" }
          $expected = (Get-Content 'C:\sztu-ci\app\package.json' -Raw | ConvertFrom-Json).version
          if ($acceptance.version -ne $expected) { throw "Acceptance ran $($acceptance.version), the checkout is $expected" }
          if ($acceptance.documents.Count -lt 7) { throw 'Not every document type was exercised' }
          if ($acceptance.windows_environment.missing_comspec -ne 'pass') { throw 'The COMSPEC regression did not run' }
          $pages = ($acceptance.documents | Measure-Object -Property preview_pages -Sum).Sum
          Write-Host "PASS chinese-profile acceptance: $($acceptance.documents.Count) documents, $pages pages, version $($acceptance.version)"
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chinese-profile-acceptance-${{ github.sha }}
          path: |
            C:\sztu-ci\accept.log
            C:\sztu-ci\acceptance.json
            C:\sztu-ci\app\tmp\ci-acceptance\acceptance.json
            C:\sztu-ci\whoami.txt
          if-no-files-found: warn

extends: ./electron-builder.yml
productName: SZTU Docs Studio
directories:
  output: ../../release/offline
extraResources:
  - from: ../../build/offline-runtime-location.json
    to: offline-runtime-location.json
  # 随包分发系统不常备的文档字体。方正小标宋由 electron-builder.yml 复制，这里只补两款，
  # 否则 Windows 上两个任务同时写同一个文件会报 EBUSY。
  - from: ../../local-fonts
    to: document-fonts
    filter:
      - STZhongsong.ttf
      - STXingkai.ttf
win:
  artifactName: "SZTU-Docs-Studio-${version}-win-${arch}-offline.${ext}"
nsis:
  shortcutName: SZTU文档工作台
  include: ../../build/offline-runtime-installer.nsh

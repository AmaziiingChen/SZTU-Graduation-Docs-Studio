appId: org.sztu.docs.studio
productName: SZTU文档工作台
asar: true
npmRebuild: false

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - resources/thesis-template/**/*
  - package.json

extraResources:
  - from: ../../local-fonts
    to: document-fonts
    filter:
      - "**/*"
  - from: ../../backend/pyproject.toml
    to: backend/pyproject.toml
  - from: ../../template-packs
    to: template-packs
    filter:
      - "**/*"
  - from: ../../build/bundled-template-engines
    to: bundled-template-engines
    filter:
      - "**/*"
  - from: ../../config/remote-services.production.json
    to: remote-services.json

mac:
  extraResources:
    - from: ../../build/sidecar/darwin-${arch}
      to: sidecar
      filter:
        - sztu-docs-backend
        - build-manifest.json
  category: public.app-category.productivity
  icon: build/icon.icns
  identity: "-"
  hardenedRuntime: false
  electronLanguages:
    - en
    - zh_CN
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  title: "SZTU文档工作台 ${version}"

artifactName: "SZTU-Docs-Studio-${version}-mac-${arch}.${ext}"

win:
  executableName: SZTU-Docs-Studio
  icon: build/icon.ico
  artifactName: "SZTU-Docs-Studio-${version}-win-${arch}.${ext}"
  extraResources:
    - from: ../../build/sidecar/win32-${arch}
      to: sidecar
      filter:
        - sztu-docs-backend.exe
        - build-manifest.json
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
